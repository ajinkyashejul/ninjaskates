name = "ninjaskates"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Static client — served directly from the edge; only /api/* and /ws/*
# requests invoke the worker.
[assets]
directory = "public"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# SQLite-backed classes work on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

[observability]
enabled = true
